name: Release

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read skill version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          from pathlib import Path
          import re

          content = Path("skills/stock-metadata/SKILL.md").read_text(encoding="utf-8")
          match = re.search(r'^  version: "([0-9]+\.[0-9]+\.[0-9]+)"$', content, re.MULTILINE)
          if not match:
              raise SystemExit("Unable to read semantic version from SKILL.md")
          print(match.group(1))
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check whether GitHub Release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compile Python source
        if: steps.release.outputs.exists == 'false'
        run: python -m compileall -q scripts skills tests

      - name: Validate JSON reference files
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m json.tool skills/stock-metadata/references/banned_terms.json > /dev/null
          python -m json.tool skills/stock-metadata/references/platforms.json > /dev/null

      - name: Run unit tests
        if: steps.release.outputs.exists == 'false'
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build skill packages
        if: steps.release.outputs.exists == 'false'
        run: python scripts/build.py

      - name: Validate built package
        if: steps.release.outputs.exists == 'false'
        run: python -m unittest tests.test_skill_structure.SkillStructureTests.test_built_archive_contains_required_skill_file -v

      - name: Create checksum
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          cd dist
          sha256sum ./*.skill > SHA256SUMS.txt

      - name: Ensure version tag exists
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Opustock Skills ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.skill \
            dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Opustock Skills ${{ steps.version.outputs.tag }}"

      - name: Verify published assets and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSETS="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          grep -Fx "stock-metadata.skill" <<< "${ASSETS}"
          grep -Fx "SHA256SUMS.txt" <<< "${ASSETS}"

          rm -rf release-verification
          mkdir release-verification
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-verification
          cd release-verification
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="release/${TAG}" \
            -f description="Verified ${TAG} package and checksum" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
