name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python source
        run: python -m compileall -q scripts skills tests

      - name: Validate JSON reference files
        run: |
          python -m json.tool skills/stock-metadata/references/banned_terms.json > /dev/null
          python -m json.tool skills/stock-metadata/references/platforms.json > /dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build skill packages
        run: python scripts/build.py

      - name: Validate built package
        run: python -m unittest tests.test_skill_structure.SkillStructureTests.test_built_archive_contains_required_skill_file -v
